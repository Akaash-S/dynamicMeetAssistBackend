version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-meeting-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      # Flask Configuration
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-8000}
      
      # Admin Configuration
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}

      # Database Configuration (AWS RDS)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      
      # Email Configuration
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - FROM_NAME=${FROM_NAME:-AI Meeting Assistant}
      
      # Google OAuth & Calendar
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # AI Services (RapidAPI, Gemini, Groq)
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_TWO=${GROQ_API_KEY_TWO}
      
      # Chatbot & Voice
      - GROQ_MODEL=${GROQ_MODEL}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - VECTOR_STORE_PATH=${VECTOR_STORE_PATH}
      - VECTOR_STORE_COLLECTION=${VECTOR_STORE_COLLECTION}
      - CHATBOT_MAX_CONTEXT_LENGTH=${CHATBOT_MAX_CONTEXT_LENGTH}
      - VOICE_AI_ENABLED=${VOICE_AI_ENABLED}

      # Security
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - ALLOWED_EXTENSIONS=${ALLOWED_EXTENSIONS}
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      # Application Configuration
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount temp directory for file processing
      - ./temp:/app/temp
    
    networks:
      - ai-meeting-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "https://dynamicmeetassistbackend-1.onrender.com/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-meeting-network:
    driver: bridge

volumes:
  logs:
  temp:
